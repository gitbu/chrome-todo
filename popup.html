<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 快速添加输入框 -->
    <div class="quick-add">
      <input
        type="text"
        id="quickAddInput"
        class="quick-add-input"
        placeholder="添加任务..."
      >
      <button class="quick-add-btn" id="quickAddBtn">
        <span>+</span>
      </button>
    </div>

    <!-- 智能列表导航 -->
    <div class="smart-lists">
      <div class="list-item active" data-view="inbox">
        <span class="list-icon">📥</span>
        <span class="list-name">收集箱</span>
        <span class="list-count" id="inboxCount">0</span>
      </div>
      <div class="list-item" data-view="today">
        <span class="list-icon">📅</span>
        <span class="list-name">今天</span>
        <span class="list-count" id="todayCount">0</span>
      </div>
      <div class="list-item" data-view="tomorrow">
        <span class="list-icon">☀️</span>
        <span class="list-name">明天</span>
        <span class="list-count" id="tomorrowCount">0</span>
      </div>
      <div class="list-item" data-view="next7days">
        <span class="list-icon">📆</span>
        <span class="list-name">接下来7天</span>
        <span class="list-count" id="next7daysCount">0</span>
      </div>
    </div>

    <!-- 分隔线 -->
    <div class="divider"></div>

    <!-- 自定义列表 -->
    <div class="custom-lists">
      <div class="lists-header">
        <span class="lists-title">列表</span>
        <button class="add-list-btn" id="addListBtn" title="添加列表">+</button>
      </div>
      <div class="lists-container" id="listsContainer">
        <!-- 列表动态插入 -->
      </div>
    </div>

    <!-- 分隔线 -->
    <div class="divider"></div>

    <!-- 任务列表区域 -->
    <div class="tasks-section">
      <div class="tasks-header">
        <h3 class="tasks-title" id="tasksTitle">收集箱</h3>
        <div class="tasks-actions">
          <button class="task-action-btn" id="sortBtn" title="排序">
            <span>↕️</span>
          </button>
          <button class="task-action-btn" id="moreBtn" title="更多">
            <span>⋯</span>
          </button>
        </div>
      </div>

      <!-- 任务列表 -->
      <div class="tasks-list" id="tasksList">
        <!-- 任务动态插入 -->
      </div>

      <!-- 已完成任务折叠区 -->
      <div class="completed-section hidden" id="completedSection">
        <div class="completed-header" id="completedHeader">
          <span class="completed-toggle">▶</span>
          <span class="completed-title">已完成</span>
          <span class="completed-count" id="completedCountLabel">0</span>
        </div>
        <div class="completed-tasks hidden" id="completedTasks">
          <!-- 已完成任务动态插入 -->
        </div>
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="footer-actions">
      <button class="footer-btn" id="openFullBtn" title="打开完整页面">
        <span>🔗</span>
        <span>完整页面</span>
      </button>
      <button class="footer-btn" id="settingsBtn" title="设置">
        <span>⚙️</span>
        <span>设置</span>
      </button>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="popup-app.js"></script>
</body>
</html>
