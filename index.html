<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Manager</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-container">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="app-title">📝 Todo Manager</h1>
      </div>

      <nav class="sidebar-nav">
        <!-- 主要导航 -->
        <div class="nav-section">
          <div class="nav-item active" data-view="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">首页</span>
            <span class="nav-count" id="homeCount">0</span>
          </div>
          <div class="nav-item" data-view="today">
            <span class="nav-icon">📅</span>
            <span class="nav-label">今天</span>
            <span class="nav-count" id="todayCount">0</span>
          </div>
          <div class="nav-item" data-view="tomorrow">
            <span class="nav-icon">☀️</span>
            <span class="nav-label">明天</span>
            <span class="nav-count" id="tomorrowCount">0</span>
          </div>
          <div class="nav-item" data-view="next7days">
            <span class="nav-icon">📆</span>
            <span class="nav-label">接下来7天</span>
            <span class="nav-count" id="next7daysCount">0</span>
          </div>
        </div>

        <!-- 列表/项目 -->
        <div class="nav-section">
          <div class="section-header">
            <span class="section-title">列表</span>
            <button class="icon-btn-small" id="addTagBtn" title="添加列表">+</button>
          </div>
          <div id="tagsList" class="tags-list">
            <!-- 列表动态插入 -->
          </div>
        </div>
      </nav>
    </aside>

    <!-- 中间待办列表 -->
    <main class="main-content">
      <!-- 顶部标题栏 -->
      <header class="content-header">
        <h2 class="view-title" id="viewTitle">首页</h2>
        <div class="header-actions">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="搜索待办事项..."
            >
            <button class="btn-icon" id="clearSearchBtn" title="清除搜索" style="display: none;">
              <span>✕</span>
            </button>
          </div>
          <div class="sort-dropdown">
            <button class="btn-icon" id="sortBtn" title="排序">
              <span>↕️</span>
            </button>
            <div class="sort-menu hidden" id="sortMenu">
              <div class="sort-option" data-sort="manual">
                <span>📌</span> 手动排序
              </div>
              <div class="sort-option" data-sort="date">
                <span>📅</span> 按日期
              </div>
              <div class="sort-option" data-sort="priority">
                <span>⭐</span> 按优先级
              </div>
              <div class="sort-option" data-sort="title">
                <span>🔤</span> 按标题
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- 统计面板（仅首页显示） -->
      <div class="stats-panel" id="statsPanel">
        <div class="stat-card">
          <div class="stat-number" id="totalTasks">0</div>
          <div class="stat-label">总任务</div>
        </div>
        <div class="stat-card">
          <div class="stat-number highlight" id="pendingTasks">0</div>
          <div class="stat-label">未完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-number success" id="completedTasks">0</div>
          <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="todayTasks">0</div>
          <div class="stat-label">今天</div>
        </div>
      </div>

      <!-- 添加待办事项 -->
      <div class="add-todo-form">
        <input
          type="text"
          id="newTodoInput"
          class="add-todo-input"
          placeholder="添加待办事项，回车保存..."
        >
        <div class="quick-actions">
          <button class="quick-action-btn" id="quickDateBtn" title="设置日期">📅</button>
          <button class="quick-action-btn" id="quickPriorityBtn" title="设置优先级">⭐</button>
          <button class="quick-action-btn" id="quickListBtn" title="选择列表">📁</button>
        </div>
      </div>

      <!-- 待办列表 -->
      <div class="todos-wrapper">
        <!-- 未完成任务 -->
        <div class="todos-container" id="todosContainer">
          <!-- 待办事项动态插入 -->
        </div>

        <!-- 已完成任务折叠区域 -->
        <div class="completed-section" id="completedSection" style="display: none;">
          <div class="completed-header" id="completedHeader">
            <span class="completed-toggle">▼</span>
            <span class="completed-title">已完成</span>
            <span class="completed-count" id="completedCount">0</span>
          </div>
          <div class="completed-tasks" id="completedTasks">
            <!-- 已完成的任务动态插入 -->
          </div>
        </div>
      </div>
    </main>

    <!-- 右侧详情面板 -->
    <aside class="detail-panel" id="detailPanel">
      <div class="detail-content">
        <div class="detail-empty">
          <div class="empty-icon">📝</div>
          <div class="empty-text">选择一个待办事项查看详情</div>
        </div>

        <div class="detail-form hidden" id="detailForm">
          <!-- 顶部操作栏 -->
          <div class="detail-header">
            <button class="icon-action-btn close-btn" id="closeDetailBtn">✕</button>
          </div>

          <!-- 完成状态 + 标题 -->
          <div class="detail-title-section">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="detailCompletedCheckbox" class="detail-checkbox">
              <span class="checkbox-custom"></span>
            </label>
            <textarea
              class="detail-title-input"
              id="detailTitleInput"
              placeholder="待办事项标题..."
              rows="1"
            ></textarea>
          </div>

          <!-- 详情列表 -->
          <div class="detail-items">
            <!-- 截止日期 -->
            <div class="detail-item" id="detailDateItem">
              <div class="detail-item-icon">📅</div>
              <div class="detail-item-content">
                <div class="detail-item-label">截止日期</div>
                <div class="detail-item-value">
                  <input type="date" id="detailDateInput" class="detail-date-input">
                  <div class="date-shortcuts hidden" id="dateShortcuts">
                    <div class="date-shortcut" data-shortcut="today">今天</div>
                    <div class="date-shortcut" data-shortcut="tomorrow">明天</div>
                    <div class="date-shortcut" data-shortcut="nextWeek">下周</div>
                    <div class="date-shortcut" data-shortcut="clear">清除</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 优先级 -->
            <div class="detail-item" id="detailPriorityItem">
              <div class="detail-item-icon">⭐</div>
              <div class="detail-item-content">
                <div class="detail-item-label">优先级</div>
                <div class="detail-item-value">
                  <div class="priority-buttons">
                    <button class="priority-btn active" data-priority="none">
                      <span class="priority-dot"></span>
                      <span>无</span>
                    </button>
                    <button class="priority-btn priority-low" data-priority="low">
                      <span class="priority-dot"></span>
                      <span>低</span>
                    </button>
                    <button class="priority-btn priority-medium" data-priority="medium">
                      <span class="priority-dot"></span>
                      <span>中</span>
                    </button>
                    <button class="priority-btn priority-high" data-priority="high">
                      <span class="priority-dot"></span>
                      <span>高</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 列表 -->
            <div class="detail-item" id="detailListItem">
              <div class="detail-item-icon">📁</div>
              <div class="detail-item-content">
                <div class="detail-item-label">列表</div>
                <div class="detail-item-value">
                  <select id="detailListSelect" class="detail-list-select">
                    <option value="">无列表</option>
                    <!-- 列表选项动态插入 -->
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- 子任务区域 -->
          <div class="detail-section">
            <div class="section-header-with-action">
              <label class="section-label">☑️ 子任务</label>
            </div>
            <div class="subtasks-list" id="subtasksList">
              <!-- 子任务动态插入 -->
            </div>
            <div class="add-subtask-form">
              <input
                type="text"
                id="newSubtaskInput"
                class="add-subtask-input"
                placeholder="添加子任务..."
              >
              <button class="btn-add-subtask" id="addSubtaskBtn">+</button>
            </div>
          </div>

          <!-- 备注 -->
          <div class="detail-section">
            <label class="section-label">📝 备注</label>
            <textarea
              id="detailNotesInput"
              class="detail-notes-textarea"
              placeholder="添加备注..."
              rows="6"
            ></textarea>
          </div>

          <!-- 删除按钮 -->
          <div class="detail-footer">
            <button class="btn-delete" id="deleteTodoBtn">
              <span>🗑️</span>
              <span>删除任务</span>
            </button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
